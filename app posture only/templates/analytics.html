<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ERGOSENSE | Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #020617; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; }
        .navbar { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .navbar-brand { font-weight: 800; letter-spacing: 2px; color: #c7d2fe !important; }
        .nav-link { color: #94a3b8 !important; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { color: #818cf8 !important; }
        
        .glass-panel { background: rgba(10, 15, 30, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 20px; padding: 25px; height: 100%; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
        
        .table-dark { background-color: transparent; font-size: 0.9rem;}
        .table-dark td, .table-dark th { background: transparent; border-bottom: 1px solid rgba(255,255,255,0.05); color: #cbd5e1; }
        
        .construction-panel { display: flex; align-items: center; justify-content: center; text-align: center; color: #64748b; font-style: italic; border: 1px dashed rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/">ERGOSENSE</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon" style="filter: invert(1);"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Scanner</a></li>
                <li class="nav-item"><a class="nav-link active" href="/analytics">Analytics</a></li>
                <li class="nav-item"><a class="nav-link" href="/help">Help</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <h3 class="mb-4" style="color: #94a3b8;">Data & Analytics Dashboard</h3>
    
    <div class="row g-4 mb-4">
        <div class="col-md-5">
            <div class="glass-panel d-flex flex-column align-items-center">
                <h5 style="color: #818cf8; margin-bottom: 20px;">Posture Health Score</h5>
                <div style="width: 80%; max-width: 250px;">
                    <canvas id="postureChart"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="glass-panel" style="max-height: 350px; overflow-y: auto;">
                <h5 style="color: #818cf8; margin-bottom: 15px;">Database Logs (SQLite)</h5>
                <table class="table table-dark">
                    <thead><tr><th>Time</th><th>Status</th><th>Mode</th></tr></thead>
                    <tbody id="historyTableBody">
                        <tr><td colspan="3" class="text-center text-muted">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <h5 class="mt-5 mb-3" style="color: #64748b;">Future Integrations</h5>
    <div class="row g-4">
        <div class="col-md-3">
            <div class="glass-panel construction-panel" style="height: 150px;">
                <div>🛠️ Panel 1<br><small>Under Construction</small></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="glass-panel construction-panel" style="height: 150px;">
                <div>🛠️ Panel 2<br><small>Under Construction</small></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="glass-panel construction-panel" style="height: 150px;">
                <div>🛠️ Panel 3<br><small>Under Construction</small></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="glass-panel construction-panel" style="height: 150px;">
                <div>🛠️ Panel 4<br><small>Under Construction</small></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Initialize empty chart
    const ctx = document.getElementById('postureChart').getContext('2d');
    let postureChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Correct', 'Incorrect'],
            datasets: [{
                data: [50, 50],
                backgroundColor: ['#10b981', '#ef4444'], // Green, Red
                borderColor: '#020617',
                borderWidth: 2
            }]
        },
        options: { cutout: '75%', plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1' } } } }
    });

    function updateData() {
        fetch('/get_history').then(res => res.json()).then(data => {
            // 1. Update Table
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = ""; 
            if (data.length === 0) tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">No database logs yet.</td></tr>`;
            
            let goodCount = 0; let badCount = 0;

            data.forEach(row => {
                if(row.status === "Correct") goodCount++; else badCount++;
                let color = row.status === "Incorrect" ? "text-danger" : "text-success";
                tbody.innerHTML += `<tr><td style="color:#64748b;">${row.time}</td><td class="${color} fw-bold">${row.status}</td><td style="color:#cbd5e1;">${row.mode}</td></tr>`;
            });

            // 2. Update Chart
            if(goodCount > 0 || badCount > 0) {
                postureChart.data.datasets[0].data = [goodCount, badCount];
                postureChart.update();
            }
        });
    }
    updateData(); // Load immediately
    setInterval(updateData, 5000); // Refresh every 5 seconds
</script>
</body>
</html>
