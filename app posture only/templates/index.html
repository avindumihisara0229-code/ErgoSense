<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ERGOSENSE | Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #020617; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; }
        .navbar { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .navbar-brand { font-weight: 800; letter-spacing: 2px; color: #c7d2fe !important; }
        .nav-link { color: #94a3b8 !important; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { color: #818cf8 !important; }
        .container { max-width: 900px; margin-top: 30px; }
        .glass-panel { background: rgba(10, 15, 30, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); padding: 25px; }
        .glass-dropdown-menu { background: rgba(5, 10, 20, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 15px; padding: 15px; min-width: 250px; }
        .form-switch .form-check-input { background-color: rgba(255,255,255,0.1); border: none; }
        .form-switch .form-check-input:checked { background-color: #6366f1; }
        .video-wrapper { position: relative; width: 100%; border-radius: 15px; overflow: hidden; background: #000; min-height: 480px; border: 1px solid rgba(255, 255, 255, 0.02); }
        #videoElement { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; opacity: 0; }
        .camera-off-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #818cf8; text-align: center; display: none; }
        #loadingOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .bouncing-loader { display: flex; gap: 0.5rem; margin-bottom: 15px; }
        .bouncing-loader span { width: 0.75rem; height: 0.75rem; background-color: #818cf8; border-radius: 50%; animation: liquid-bounce 1s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5); }
        .bouncing-loader span:nth-child(2) { animation-delay: 0.2s; }
        .bouncing-loader span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes liquid-bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
        #statusBox { font-size: 1.5rem; font-weight: bold; padding: 15px; margin-top: 20px; border-radius: 15px; text-align: center; transition: all 0.3s ease; }
        .correct { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
        .incorrect { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
        .neutral { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255,255,255,0.05); color: #64748b; }
        #timerBox { font-size: 1.2rem; margin-top: 10px; display: none; text-align: center; color: #fbbf24; }
        .btn-calibrate { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; border-radius: 10px; padding: 8px 20px; font-weight: bold; transition: 0.3s; }
        .btn-calibrate:hover { box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); transform: scale(1.05); color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/">ERGOSENSE</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon" style="filter: invert(1);"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="/">Scanner</a></li>
                <li class="nav-item"><a class="nav-link" href="/analytics">Analytics</a></li>
                <li class="nav-item"><a class="nav-link" href="/help">Help</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="m-0" style="color: #94a3b8;">Live Analysis</h3>
        
        <div>
            <button id="calibrateBtn" class="btn btn-calibrate me-2">🎯 Calibrate Baseline</button>

            <div class="dropdown d-inline-block">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" style="border-radius: 10px;">⚙️ Settings</button>
                <ul class="dropdown-menu dropdown-menu-end glass-dropdown-menu">
                    <li><h6 class="dropdown-header" style="color: #818cf8;">System Controls</h6></li>
                    <li class="dropdown-item-text"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="systemToggle" checked><label class="form-check-label" for="systemToggle">Master Power</label></div></li>
                    <li><hr class="dropdown-divider" style="border-color: rgba(255,255,255,0.05);"></li>
                    <li class="dropdown-item-text"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="videoToggle"><label class="form-check-label" for="videoToggle">Show Video Feed</label></div></li>
                    <li class="dropdown-item-text"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="soundToggle" checked><label class="form-check-label" for="soundToggle">Alert Sound</label></div></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="glass-panel">
        <div class="video-wrapper">
            <div id="loadingOverlay">
                <div class="bouncing-loader"><span></span><span></span><span></span></div>
                <h6 style="color: #64748b; letter-spacing: 2px; margin-top: 10px;" id="loadingText">ANALYZING POSTURE</h6>
            </div>
            <video id="videoElement" autoplay playsinline></video>
            <div class="camera-off-msg" id="cameraMsg">
                <h4>👁️ Feed Closed</h4>
                <p style="color: #64748b;">ErgoSense is tracking in the background.</p>
            </div>
        </div>
        <div id="statusBox" class="neutral">System Initializing...</div>
        <div id="timerBox"></div>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>
<audio id="alertSound" src="{{ url_for('static', filename='audio/1.wav') }}"></audio>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const video = document.getElementById('videoElement'), canvas = document.getElementById('canvas'), context = canvas.getContext('2d'), statusBox = document.getElementById('statusBox'), timerBox = document.getElementById('timerBox'), alertSound = document.getElementById('alertSound'), cameraMsg = document.getElementById('cameraMsg'), loadingOverlay = document.getElementById('loadingOverlay'), systemToggle = document.getElementById('systemToggle'), videoToggle = document.getElementById('videoToggle'), soundToggle = document.getElementById('soundToggle'), calibrateBtn = document.getElementById('calibrateBtn');

    let stream = null, analysisInterval = null, isAIReady = false, idleTimer = null;
    let postureBuffer = [];
    let isCalibrated = false;

    startSystem();

    systemToggle.addEventListener('change', function() { this.checked ? startSystem() : stopSystem(); });
    videoToggle.addEventListener('change', updateVideoVisibility);

    // CALIBRATION LOGIC
    calibrateBtn.addEventListener('click', function() {
        if(!stream) return alert("Please turn on the camera to calibrate.");
        calibrateBtn.innerText = "Scanning Baseline...";
        
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        fetch('/calibrate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: canvas.toDataURL('image/jpeg') }) })
        .then(r => r.json()).then(data => {
            if(data.status === 'success') {
                alert("✅ Personalized Baseline Calibrated! ERGOSENSE is now tuned specifically to you.");
                calibrateBtn.innerText = "✅ Calibrated";
                calibrateBtn.style.background = "#10b981";
            } else {
                alert("❌ Calibration failed: " + data.message);
                calibrateBtn.innerText = "🎯 Calibrate Baseline";
            }
        });
    });

    function updateVideoVisibility() {
        if (!systemToggle.checked) return;
        if (videoToggle.checked) { video.style.opacity = "1"; cameraMsg.style.display = "none"; } 
        else { video.style.opacity = "0"; if (isAIReady) cameraMsg.style.display = "block"; }
    }

    function startSystem() {
        if (navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true }).then(function (s) {
                stream = s; video.srcObject = stream; isAIReady = false; loadingOverlay.style.display = 'flex';
                statusBox.innerText = "System Active"; statusBox.className = "neutral";
                updateVideoVisibility();
                analysisInterval = setInterval(sendFrameToBackend, 500);
            }).catch(() => document.getElementById('loadingText').innerText = "CAMERA DENIED");
        }
    }

    function stopSystem() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        stream = null; video.srcObject = null; clearInterval(analysisInterval); clearTimeout(idleTimer);
        video.style.opacity = "0"; loadingOverlay.style.display = 'none'; cameraMsg.style.display = "none";
        statusBox.innerText = "System Powered Off"; statusBox.className = "neutral"; timerBox.style.display = "none"; postureBuffer = [];
    }

    function sendFrameToBackend() {
        if (!video.videoWidth || !stream) return;
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        fetch('/predict_frame', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: canvas.toDataURL('image/jpeg') }) })
        .then(r => r.json()).then(data => {
            if (!isAIReady) { loadingOverlay.style.display = 'none'; isAIReady = true; updateVideoVisibility(); }
            if (data.status === 'success') {
                statusBox.innerText = data.result + (data.calibrated ? " [Tuned]" : ""); 
                statusBox.className = data.is_bad ? 'incorrect' : 'correct';
                postureBuffer.push(data.is_bad);
            } else {
                statusBox.innerText = "No Person Detected"; statusBox.className = 'neutral'; postureBuffer.push(false);
            }
            if (postureBuffer.length > 30) postureBuffer.shift();
            evaluateBuffer();
        }).catch(e => console.error(e));
    }

    function evaluateBuffer() {
        let badCount = postureBuffer.filter(Boolean).length;
        if (badCount >= 18) {
            timerBox.innerHTML = "🚨 <b>BAD POSTURE! PLEASE SIT UP!</b> 🚨"; timerBox.style.color = "#f87171"; timerBox.style.display = "block";
            if (soundToggle.checked) alertSound.play().catch(e=>console.log(e));
            postureBuffer = [];
        } else if (badCount > 4) {
            timerBox.innerHTML = `⚠️ Warning: Bad Posture`; timerBox.style.color = "#fbbf24"; timerBox.style.display = "block";
        } else { timerBox.style.display = "none"; }
    }
</script>
</body>
</html>
