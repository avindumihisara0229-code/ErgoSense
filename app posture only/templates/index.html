<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Posture AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #212529; color: white; }
        .container { max-width: 900px; margin-top: 30px; }
        
        /* Video Container */
        .video-wrapper { position: relative; width: 100%; border-radius: 10px; overflow: hidden; border: 3px solid #444; background: #000; min-height: 480px; }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }
        .camera-off-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #aaa; display: none; }

        /* Controls */
        .controls-bar { background: #333; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Status Box */
        #statusBox { 
            font-size: 1.5rem; font-weight: bold; padding: 15px; margin-top: 20px; 
            border-radius: 10px; background-color: #444; text-align: center; 
        }
        .correct { background-color: #198754 !important; }
        .incorrect { background-color: #dc3545 !important; }
        .neutral { background-color: #444; color: #aaa; }

        /* Timer Alert */
        #timerBox { font-size: 1.2rem; margin-top: 10px; color: #ffca2c; display: none; text-align: center; }

        /* History Table */
        .table-dark { background-color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">🧘 Smart Posture Tracker</h2>

    <div class="controls-bar">
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="cameraToggle" checked>
            <label class="form-check-label" for="cameraToggle">📷 Live Camera</label>
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="soundToggle" checked>
            <label class="form-check-label" for="soundToggle">🔊 Alert Sound</label>
        </div>
    </div>

    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="live-tab" data-bs-toggle="tab" data-bs-target="#live" type="button">📡 Live Monitor</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history" type="button">📜 History Log</button>
        </li>
    </ul>

    <div class="tab-content pt-3">
        <div class="tab-pane fade show active" id="live">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="video-wrapper">
                        <video id="videoElement" autoplay playsinline></video>
                        <h4 class="camera-off-msg" id="cameraMsg">Camera is OFF</h4>
                    </div>
                    
                    <div id="statusBox" class="neutral">System Ready</div>
                    <div id="timerBox">⚠️ Bad Posture detected! Alert in <span id="countdown">15</span>s</div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="history">
            <h4 class="mb-3">Recent Posture Events</h4>
            <div style="max-height: 400px; overflow-y: auto;">
                <table class="table table-dark table-striped">
                    <thead><tr><th>Time</th><th>Status</th><th>View Mode</th></tr></thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<audio id="alertSound" src="{{ url_for('static', filename='audio/1.wav') }}"></audio>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- VARIABLES ---
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const statusBox = document.getElementById('statusBox');
    const timerBox = document.getElementById('timerBox');
    const alertSound = document.getElementById('alertSound');
    const cameraMsg = document.getElementById('cameraMsg');

    // Toggles
    const cameraToggle = document.getElementById('cameraToggle');
    const soundToggle = document.getElementById('soundToggle');

    let stream = null;
    let analysisInterval = null;
    let historyInterval = null;
    
    // Timer Variables
    let badPostureStartTime = null; 
    let alertTriggered = false;     
    const ALERT_DELAY = 15000; // 15 seconds

    // --- 1. INITIALIZE ---
    startCamera(); // Auto-start on load

    // --- 2. CAMERA CONTROLS ---
    cameraToggle.addEventListener('change', function() {
        if (this.checked) {
            startCamera();
        } else {
            stopCamera();
        }
    });

    function startCamera() {
        if (navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function (s) {
                    stream = s;
                    video.srcObject = stream;
                    video.style.opacity = "1";
                    cameraMsg.style.display = "none";
                    
                    // Start Analysis Loop
                    analysisInterval = setInterval(sendFrameToBackend, 500); 
                    historyInterval = setInterval(updateHistory, 2000);
                })
                .catch(function (error) {
                    statusBox.innerText = "Camera Access Denied";
                });
        }
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        video.srcObject = null;
        video.style.opacity = "0";
        cameraMsg.style.display = "block";
        
        clearInterval(analysisInterval);
        clearInterval(historyInterval);
        statusBox.innerText = "Camera Paused";
        statusBox.className = "neutral";
        resetTimer();
    }

    // --- 3. MAIN LOOP ---
    function sendFrameToBackend() {
        if (!stream) return; // Don't send if camera is off

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataURL = canvas.toDataURL('image/jpeg');

        fetch('/predict_frame', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: dataURL })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                statusBox.innerText = data.result;
                
                if (data.is_bad) {
                    statusBox.className = 'incorrect';
                    handleBadPostureTimer();
                } else {
                    statusBox.className = 'correct';
                    resetTimer();
                }
            } else {
                statusBox.className = 'neutral';
                resetTimer();
            }
        })
        .catch(e => console.error(e));
    }

    // --- 4. TIMER & SOUND LOGIC ---
    function handleBadPostureTimer() {
        if (!badPostureStartTime) {
            badPostureStartTime = Date.now(); 
            alertTriggered = false;
        }

        const elapsed = Date.now() - badPostureStartTime;
        const secondsLeft = Math.ceil((ALERT_DELAY - elapsed) / 1000);

        if (elapsed > ALERT_DELAY) {
            // TIME IS UP!
            timerBox.innerHTML = "🚨 <b>BAD POSTURE! PLEASE SIT UP!</b> 🚨";
            timerBox.style.color = "red";
            timerBox.style.display = "block";

            // PLAY SOUND IF TOGGLE IS ON
            if (!alertTriggered) {
                if (soundToggle.checked) {
                    alertSound.play().catch(e => console.log("Autoplay blocked"));
                }
                alertTriggered = true; 
            }
        } else {
            // COUNTDOWN
            timerBox.innerHTML = `⚠️ Bad Posture! Alert in <span id="countdown">${secondsLeft}</span>s`;
            timerBox.style.color = "#ffca2c";
            timerBox.style.display = "block";
        }
    }

    function resetTimer() {
        badPostureStartTime = null;
        alertTriggered = false;
        timerBox.style.display = "none";
        alertSound.pause();
        alertSound.currentTime = 0;
    }

    // --- 5. HISTORY LOGIC ---
    function updateHistory() {
        fetch('/get_history')
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = ""; 
            
            data.forEach(row => {
                let color = row.status === "Incorrect" ? "text-danger" : "text-success";
                let html = `<tr>
                    <td>${row.time}</td>
                    <td class="${color} fw-bold">${row.status}</td>
                    <td>${row.mode}</td>
                </tr>`;
                tbody.innerHTML += html;
            });
        });
    }
</script>

</body>
</html>
