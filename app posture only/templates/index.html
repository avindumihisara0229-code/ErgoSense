<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Posture AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #212529; color: white; }
        .container { max-width: 800px; margin-top: 30px; }
        #videoElement { width: 100%; border-radius: 10px; border: 3px solid #444; }
        #statusBox { 
            font-size: 2rem; 
            font-weight: bold; 
            padding: 20px; 
            margin-top: 20px; 
            border-radius: 10px; 
            background-color: #333;
            text-align: center;
        }
        .correct { background-color: #198754 !important; color: white; } /* Green */
        .incorrect { background-color: #dc3545 !important; color: white; } /* Red */
        .neutral { background-color: #333; color: #aaa; }
    </style>
</head>
<body>

<div class="container text-center">
    <h2>📡 Live Posture Tracker</h2>
    <p class="text-muted">Ensure your full left side is visible.</p>
    
    <video id="videoElement" autoplay playsinline></video>
    
    <canvas id="canvas" style="display:none;"></canvas>

    <div id="statusBox" class="neutral">Waiting for camera...</div>
</div>

<script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvas');
    const statusBox = document.getElementById('statusBox');
    const context = canvas.getContext('2d');

    // 1. Access the Webcam
    if (navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function (stream) {
                video.srcObject = stream;
                // Start the prediction loop once video is playing
                setInterval(sendFrameToBackend, 500); // Run every 500ms (0.5 sec)
            })
            .catch(function (error) {
                console.log("Something went wrong with the camera!", error);
                statusBox.innerText = "Camera Access Denied";
            });
    }

    // 2. Function to capture frame and send to Flask
    function sendFrameToBackend() {
        // Draw current video frame to canvas
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Convert canvas image to Base64 string
        const dataURL = canvas.toDataURL('image/jpeg');

        // Send to Flask using Fetch API
        fetch('/predict_frame', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: dataURL })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                statusBox.innerText = data.result;
                // Update Color
                if (data.color === 'green') {
                    statusBox.className = 'correct';
                } else {
                    statusBox.className = 'incorrect';
                }
            } else if (data.status === 'no_pose') {
                statusBox.innerText = "No person detected";
                statusBox.className = 'neutral';
            }
        })
        .catch(error => console.error('Error:', error));
    }
</script>

</body>
</html>
