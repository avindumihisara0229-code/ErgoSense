<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErgoSense | Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --glass-bg: rgba(28, 28, 30, 0.5);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --apple-blue: #0A84FF;
            --apple-green: #30D158;
            --apple-red: #FF453A;
            --apple-orange: #FF9F0A;
            --apple-purple: #BF5AF2;
        }

        body { 
            background-color: var(--bg-color); 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(10, 132, 255, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(191, 90, 242, 0.15), transparent 25%);
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; 
            min-height: 100vh;
        }

        .navbar { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); padding: 15px 0; }
        .navbar-brand { font-weight: 700; color: var(--text-main) !important; font-size: 1.3rem; }
        .nav-link { color: var(--text-muted) !important; font-weight: 500; transition: color 0.3s ease; }
        .nav-link:hover, .nav-link.active { color: var(--text-main) !important; }

        .glass-panel { 
            background: var(--glass-bg); backdrop-filter: blur(30px); 
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); 
        }

        .table-dark { background-color: transparent; font-size: 0.85rem;}
        .table-dark td, .table-dark th { background: transparent; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text-main); padding: 10px 8px;}
        .table-dark th { color: var(--text-muted); text-transform: uppercase; }
        
        .chart-wrapper { position: relative; height: 180px; width: 100%; display: flex; align-items: center; justify-content: center;}
        .table-wrapper { max-height: 180px; overflow-y: auto; overflow-x: hidden; padding-right: 5px; }

        .golden-hour-text { font-size: 4rem; font-weight: 700; background: linear-gradient(135deg, #30D158, #0A84FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 10px 0; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container-fluid px-lg-5">
        <a class="navbar-brand" href="/">ErgoSense</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Scanner</a></li>
                <li class="nav-item"><a class="nav-link active" href="/analytics">Analytics</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid px-lg-5 mb-5">
    
    <div class="row g-4 mb-4">
        <div class="col-md-9">
            <div class="glass-panel">
                <h6 style="color: var(--text-main); font-weight: 600; margin-bottom: 20px;">24-Hour Multi-Modal Stress & Fatigue Forecast</h6>
                <div style="height: 250px; width: 100%;"><canvas id="stressTrendChart"></canvas></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="glass-panel text-center d-flex flex-column justify-content-center align-items-center h-100">
                <h6 style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Optimal Focus Window</h6>
                <div id="bestTimeDisplay" class="golden-hour-text">--:--</div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="glass-panel">
                <h6 style="color: var(--text-main); font-weight: 600; margin-bottom: 20px;">Posture Framework Logs</h6>
                <div class="row align-items-center">
                    <div class="col-5 chart-wrapper"><canvas id="postureChart"></canvas></div>
                    <div class="col-7 table-wrapper">
                        <table class="table table-dark">
                            <tbody id="historyTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="glass-panel">
                <h6 style="color: var(--text-main); font-weight: 600; margin-bottom: 20px;">Vocal Stress Telemetry</h6>
                <div class="row align-items-center">
                    <div class="col-5 chart-wrapper"><canvas id="vocalChart"></canvas></div>
                    <div class="col-7 table-wrapper">
                        <table class="table table-dark">
                            <tbody id="vocalTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="glass-panel">
                <h6 style="color: var(--text-main); font-weight: 600; margin-bottom: 20px;">Facial Stress (AI)</h6>
                <div class="row align-items-center">
                    <div class="col-5 chart-wrapper"><canvas id="visualChart"></canvas></div>
                    <div class="col-7 table-wrapper">
                        <table class="table table-dark">
                            <tbody id="visualTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="glass-panel">
                <h6 style="color: var(--text-main); font-weight: 600; margin-bottom: 20px;">Drowsiness Index</h6>
                <div class="row align-items-center">
                    <div class="col-5 chart-wrapper"><canvas id="drowsChart"></canvas></div>
                    <div class="col-7 table-wrapper">
                        <table class="table table-dark">
                            <tbody id="drowsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    Chart.defaults.color = '#86868b';
    const clrGood = '#30D158', clrBad = '#FF453A';

    function createDoughnutChart(ctxId, colorAccent) {
        return new Chart(document.getElementById(ctxId).getContext('2d'), {
            type: 'doughnut',
            data: { datasets: [{ data: [1, 0], backgroundColor: [colorAccent, clrBad], borderWidth: 0 }] },
            options: { cutout: '80%', plugins: { legend: false }, responsive: true, maintainAspectRatio: false }
        });
    }

    const charts = {
        pos: createDoughnutChart('postureChart', '#30D158'),
        voc: createDoughnutChart('vocalChart', '#FF9F0A'),
        vis: createDoughnutChart('visualChart', '#0A84FF'),
        dro: createDoughnutChart('drowsChart', '#BF5AF2')
    };

    let trendChart = new Chart(document.getElementById('stressTrendChart').getContext('2d'), {
        type: 'line', 
        data: { labels: [], datasets: [] },
        options: { 
            responsive: true, maintainAspectRatio: false,
            scales: { y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.05)' } } } 
        }
    });

    function updateData() {
        // Multi-Modal History
        fetch('/get_history_all').then(res => res.json()).then(data => {
            let pG = 0, pB = 0, vG = 0, vB = 0, dG = 0, dB = 0;
            document.getElementById('historyTableBody').innerHTML = "";
            document.getElementById('visualTableBody').innerHTML = "";
            document.getElementById('drowsTableBody').innerHTML = "";

            data.forEach(row => {
                if (row.mode !== "Vocal") {
                    const time = row.time.split(" ")[1];
                    // Posture
                    if(row.posture === "Correct") pG++; else pB++;
                    document.getElementById('historyTableBody').innerHTML += `<tr><td>${time}</td><td style="color:${row.posture==='Correct'?clrGood:clrBad}">${row.posture}</td></tr>`;
                    // Visual
                    if(row.visual === "Optimal") vG++; else vB++;
                    document.getElementById('visualTableBody').innerHTML += `<tr><td>${time}</td><td style="color:${row.visual==='Optimal'?clrGood:clrBad}">${row.visual}</td></tr>`;
                    // Drowsy
                    if(row.drowsy === "Alert") dG++; else dB++;
                    document.getElementById('drowsTableBody').innerHTML += `<tr><td>${time}</td><td style="color:${row.drowsy==='Alert'?clrGood:clrBad}">${row.drowsy}</td></tr>`;
                }
            });
            charts.pos.data.datasets[0].data = [pG, pB]; charts.pos.update();
            charts.vis.data.datasets[0].data = [vG, vB]; charts.vis.update();
            charts.dro.data.datasets[0].data = [dG, dB]; charts.dro.update();
        });

        // Vocal History
        fetch('/get_vocal_history').then(res => res.json()).then(data => {
            let g = 0, b = 0;
            document.getElementById('vocalTableBody').innerHTML = "";
            data.forEach(row => {
                const isBad = row.status === "Stress Detected";
                if(!isBad) g++; else b++;
                const time = row.time.split(" ")[1];
                document.getElementById('vocalTableBody').innerHTML += `<tr><td>${time}</td><td style="color:${!isBad?clrGood:clrBad}">${row.status}</td></tr>`;
            });
            charts.voc.data.datasets[0].data = [g, b]; charts.voc.update();
        });
    }

    function updateTrend() {
        fetch('/api/stress_data').then(res => res.json()).then(data => {
            trendChart.data = {
                labels: data.labels,
                datasets: [
                    { label: 'Posture', data: data.posture, borderColor: '#30D158', tension: 0.3 },
                    { label: 'Vocal', data: data.vocal, borderColor: '#FF9F0A', tension: 0.3 },
                    { label: 'Stress', data: data.visual, borderColor: '#0A84FF', tension: 0.3 },
                    { label: 'Drowsy', data: data.drowsiness, borderColor: '#BF5AF2', tension: 0.3 },
                    { label: 'Unified Index', data: data.overall, borderColor: '#FFFFFF', borderWidth: 3, fill: true, tension: 0.4 }
                ]
            };
            trendChart.update();
            document.getElementById('bestTimeDisplay').innerText = data.best_hour;
        });
    }

    updateData(); updateTrend();
    setInterval(updateData, 3000);
    setInterval(updateTrend, 10000);
</script>
</body>
</html>
